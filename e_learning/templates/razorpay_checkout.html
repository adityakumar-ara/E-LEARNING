{% extends 'main.html' %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4 text-center">
          <i class="bi bi-shield-lock-fill text-primary fs-1"></i>
          <h1 class="h3 mt-3">Secure Payment</h1>
          <p class="text-muted mb-1">{{ course.course_name }}</p>
          <p class="display-6 fw-bold text-primary mb-4">₹{{ amount|floatformat:-2 }}</p>
          <button id="razorpay-pay-button" class="btn btn-primary btn-lg w-100">Pay securely with Razorpay</button>
          <p class="small text-muted mt-3 mb-0">Your payment is processed securely by Razorpay.</p>
        </div>
      </div>
    </div>
  </div>
</div>

<form id="payment-confirmation" method="post" action="{{ callback_url }}">
  {% csrf_token %}
  <input type="hidden" name="razorpay_payment_id">
  <input type="hidden" name="razorpay_order_id">
  <input type="hidden" name="razorpay_signature">
</form>
{% endblock content %}

{% block extra_js %}
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

{% endblock extra_js %}
